name: validate-runtime-control

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TRUSTED_SELF_REPOSITORY_ID: '1343816194'
  TRUSTED_CORE_REPOSITORY_ID: '1343815302'

jobs:
  validate-runtime-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install "PyYAML>=6.0,<7"
      - name: Verify stable repository identity
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY_ID" = "$TRUSTED_SELF_REPOSITORY_ID"
      - name: Resolve and fetch exact Core by stable repository ID
        shell: bash
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          readarray -t binding < <(python - <<'PY'
          import yaml
          d = yaml.safe_load(open("deployment.yaml", encoding="utf-8"))
          core = d.get("core", {}) if isinstance(d, dict) else {}
          print(core.get("repository_id", ""))
          print(core.get("commit", ""))
          PY
          )
          core_id="${binding[0]}"
          core_commit="${binding[1]}"
          test "$core_id" = "$TRUSTED_CORE_REPOSITORY_ID"
          clone_url="$(python - <<'PY'
          import json
          import os
          import urllib.request
          rid = 1343815302
          request = urllib.request.Request(
              f"https://api.github.com/repositories/{rid}",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_API_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          if data.get("id") != rid:
              raise SystemExit("GitHub repository identity mismatch")
          print(data["clone_url"])
          PY
          )"
          git init "$RUNNER_TEMP/learning-os-core"
          git -C "$RUNNER_TEMP/learning-os-core" remote add origin "$clone_url"
          git -C "$RUNNER_TEMP/learning-os-core" fetch --depth 1 origin "$core_commit"
          git -C "$RUNNER_TEMP/learning-os-core" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/learning-os-core" rev-parse HEAD)" = "$core_commit"
      - name: Validate contract with the exact deployed Core
        shell: bash
        run: |
          CORE_ROOT="$RUNNER_TEMP/learning-os-core" python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          core_root = Path(os.environ["CORE_ROOT"])
          sys.path.insert(0, str(core_root))
          from scripts.validate_learning_os import validate_deployment_contract_document

          text = Path("deployment.yaml").read_text(encoding="utf-8")
          doc = yaml.safe_load(text)
          findings = validate_deployment_contract_document(
              doc, path="deployment.yaml", raw_text=text
          )
          errors = [f for f in findings if f.severity == "error"]
          if errors:
              for finding in errors:
                  print(f"{finding.code}: {finding.path}: {finding.message}", file=sys.stderr)
              raise SystemExit(1)
          expected_id = int(os.environ["TRUSTED_CORE_REPOSITORY_ID"])
          if doc["core"]["repository_id"] != expected_id:
              raise SystemExit("core repository ID does not match trusted CI identity")
          head = subprocess.check_output(
              ["git", "-C", str(core_root), "rev-parse", "HEAD"], text=True
          ).strip()
          if doc["core"]["commit"] != head:
              raise SystemExit("deployment Core pin does not match fetched exact Core")
          print("runtime-control contract identity and exact Core binding PASS")
          PY
      - name: Reject identity and typing regressions
        shell: bash
        run: |
          CORE_ROOT="$RUNNER_TEMP/learning-os-core" python - <<'PY'
          import copy
          import os
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          core_root = Path(os.environ["CORE_ROOT"])
          sys.path.insert(0, str(core_root))
          from scripts.validate_learning_os import validate_deployment_contract_document

          expected_id = int(os.environ["TRUSTED_CORE_REPOSITORY_ID"])
          head = subprocess.check_output(
              ["git", "-C", str(core_root), "rev-parse", "HEAD"], text=True
          ).strip()
          base = yaml.safe_load(Path("deployment.yaml").read_text(encoding="utf-8"))

          def valid(doc):
              findings = validate_deployment_contract_document(doc)
              if any(f.severity == "error" for f in findings):
                  return False
              return doc["core"]["repository_id"] == expected_id and doc["core"]["commit"] == head

          if not valid(base):
              raise SystemExit("positive control failed")
          bad = copy.deepcopy(base)
          bad["deployment"]["epoch"] = True
          if valid(bad):
              raise SystemExit("boolean epoch was accepted")
          bad = copy.deepcopy(base)
          bad["core"]["repository_id"] = expected_id + 1
          if valid(bad):
              raise SystemExit("wrong Core repository ID was accepted")
          bad = copy.deepcopy(base)
          bad["core"]["commit"] = "0" * 40
          if valid(bad):
              raise SystemExit("wrong Core commit was accepted")
          print("negative identity/type controls PASS")
          PY
